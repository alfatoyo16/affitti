<style>

html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.5 "Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}

.menu-btn{display:none;background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.wrap{flex:1;display:flex;min-height:0}
nav{width:236px;background:var(--side);border-right:1px solid var(--bd);padding:12px 8px;overflow-y:auto;flex-shrink:0}

.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.step{border:1px solid var(--bd);border-radius:14px;padding:18px;background:var(--card)}

.step.next .n{background:var(--g);border-color:var(--g);color:#fff}

.step b{font-size:17px;display:block}
.step p{margin:2px 0 12px;color:var(--mu)}
.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:var(--gd)}
.btn.ghost{background:none;color:var(--tx);border:1px solid var(--bd)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.del{background:none;color:var(--rd);border:1px solid var(--bd)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.kpi span{color:var(--mu);font-size:13px}
.kpi b{display:block;font-size:24px}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.tbl th,.tbl td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--bd);vertical-align:middle}
.tbl th{font-size:13px;color:var(--mu);font-weight:600}
.tbl tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto;max-width:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top h1{margin:0}
.empty{padding:28px;text-align:center;color:var(--mu)}
.tag{font-size:12px;border-radius:99px;padding:2px 9px;background:rgba(123,160,74,.18);color:var(--gd);font-weight:600;white-space:nowrap}
.tag.w{background:rgba(239,157,69,.2);color:#b86d12}
.tag.r{background:rgba(192,69,58,.15);color:var(--rd)}
dialog{border:0;border-radius:14px;padding:22px;width:min(440px,92vw);background:var(--card);color:var(--tx);box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.4)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px;font-weight:600}
input,select{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:var(--bg);color:var(--tx)}
:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.res{margin-top:14px;padding:14px;border-radius:10px;background:var(--bg);border:1px solid var(--bd)}
.res b{font-size:20px}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{background:none;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;padding:9px 14px;font:inherit;color:var(--tx);cursor:pointer;white-space:nowrap}

.p0{padding:0;overflow:hidden;border-top-left-radius:0}
.sec{background:var(--side);font-weight:700;padding:12px 16px;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}

.fr{display:grid;grid-template-columns:190px 1fr;gap:16px;padding:10px 16px;align-items:start}

.flist{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;max-width:760px;margin-top:12px}

.th{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}

.tseg{min-width:260px}
.dd{position:relative}

.tbl th[data-s]{cursor:pointer;user-select:none;white-space:nowrap}

.nil .ic{font-size:44px;line-height:1}
.nil h2{margin:8px 0 4px;font-weight:500}
.nil p{margin:0 0 14px;color:var(--mu)}
dialog textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:var(--bg);color:var(--tx)}
.fr input.sw{appearance:none;-webkit-appearance:none;width:40px;height:22px;padding:0;border:0;border-radius:99px;background:var(--bd);position:relative;cursor:pointer;margin-top:6px}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.fr input.sw:checked{background:var(--g)}
.sw:checked::after{left:20px}
.grp{font-weight:700;border-bottom:1px solid var(--bd);padding:8px 0 6px;margin:0 0 8px;max-width:760px}
.grp:not(:first-child){margin-top:18px}
.chks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:6px 24px;max-width:760px}
.fr .chk{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--tx);font-weight:400;margin:0;cursor:pointer}
.fr .chk input{width:16px;height:16px;max-width:none;padding:0;margin:0;accent-color:var(--g)}

.inl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fr .inl input,.fr .inl select{width:120px}
.eu{display:flex;align-items:center;gap:6px}
.eu input{width:130px}
.pfoot{position:sticky;bottom:0;background:var(--side);border-top:1px solid var(--bd);padding:12px 16px;display:flex;gap:8px;margin:0 -24px -24px;padding-left:24px}
@media(max-width:760px){
.fr{grid-template-columns:1fr;gap:2px}.fr>label{text-align:left;margin-top:0}.pfoot{margin:0 -16px -16px;padding-left:16px}
.menu-btn{display:block}
nav{position:fixed;left:0;top:56px;bottom:0;z-index:5;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.2)}
nav.open{transform:none}
main{padding:16px}
.grid2{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){nav{transition:none}}
:root{--g:#0d9488;--gd:#0f766e;--or:#f97316;--bg:#eef6f6;--side:#fff;--card:#fff;--tx:#16302f;--mu:#5d7776;--bd:#d5e6e5;--bl:#0369a1;--rd:#e11d48;--hd:linear-gradient(120deg,#0f766e 0%,#0d9488 50%,#0ea5e9 100%)}

header{background:var(--hd);box-shadow:0 2px 12px rgba(15,118,110,.25)}
body{background:radial-gradient(circle at 100% 0,rgba(14,165,233,.12),transparent 45%),var(--bg)}
header .logo{font-size:19px;font-weight:800}
.ni{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--bg);margin-right:10px;font-size:16px;vertical-align:middle}

.panel,.kpi,.step,.tbl{border-radius:16px;box-shadow:0 2px 12px rgba(15,118,110,.07)}

.seg{border-color:rgba(13,148,136,.4);background:rgba(13,148,136,.1)}
.dz.hot{background:rgba(13,148,136,.12)}
.btn:not(.ghost):not(.del){background:linear-gradient(135deg,#14b8a6,#0d9488);box-shadow:0 2px 6px rgba(13,148,136,.3);border-radius:10px}
.btn:not(.ghost):not(.del):hover{background:linear-gradient(135deg,#0d9488,#0f766e)}
.btn.red:not(.ghost):not(.del),.btn.red:not(.ghost):not(.del):hover{background:linear-gradient(135deg,#fb7185,#e11d48);box-shadow:0 2px 6px rgba(225,29,72,.3)}
.add{background:rgba(255,255,255,.22)}
.warn{background:rgba(249,115,22,.12);border-left:4px solid var(--or);border-radius:12px;padding:14px 18px;margin-bottom:14px}
.fil{margin-bottom:14px}
.kp2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:12px}
.kp2>div{border-radius:14px;padding:12px 16px;border:1px solid var(--bd);background:var(--card)}
.kp2 .up{border-left:5px solid var(--g)}
.kp2 .dn{border-left:5px solid var(--rd)}
.kp2 .nt{border-left:5px solid #8b5cf6;grid-column:1/-1}
.kp2 small{display:block;color:var(--mu);font-weight:600}
.kp2 b{font-size:26px}
.pos{color:var(--g)}
.neg{color:var(--rd)}
.foot{text-align:center;padding:12px;border-top:1px solid var(--bd)}
.bil{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1.4fr);gap:20px;align-items:center}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin:0 4px 0 12px;vertical-align:middle}
.fy td:last-child,.fy th:last-child{text-align:right}
.fy .sub td:first-child{padding-left:32px;color:var(--mu)}
.fy .tot td{font-weight:700;background:var(--bg)}

nav h6{font-size:20px;letter-spacing:0;margin:14px 10px 4px;line-height:1}

var S={p:[],t:[],l:[],x:[],pay:{}},view="scrivania";

p:{t:"proprietà",f:[["nome","Nome del locale","text"],["indirizzo","Indirizzo","text"],["mq","Superficie (m²)","number"],["tipo","Tipo","select",["Negozio","Ufficio","Magazzino","Box / garage","Altro"]]]},

return'<div class="grp">'+c[0]+'</div><div class="chks">'+r.map(function(x){return'<label class="chk"><input type="checkbox" name="dot" value="'+esc(x)+'"'+(dot.indexOf(x)>-1?" checked":"")+"> "+esc(x)+"</label>"}).join("")+"</div>"}).join("");

return h+'</div><div class="pfoot"><button class="btn">Salva</button><button type="button" class="btn ghost" id="pcx">Annulla</button></div></form>'};

<script type="module">
import {firebaseConfig} from "./firebase-config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,onSnapshot,doc,writeBatch} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const q=s=>document.querySelector(s);
if(String(firebaseConfig.apiKey).startsWith("INCOLLA")){q("#boot").textContent="Prima completa il file firebase-config.js (vedi le istruzioni).";throw new Error("config mancante")}
const app=initializeApp(firebaseConfig),auth=getAuth(app),
db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const COLL=["p","t","l","x"];
let uid=null,unsubs=[],LAST={},loaded=0,started=false;
const snapOf=c=>{const m={};(S[c]||[]).forEach(o=>m[o.id]=JSON.stringify(o));return m};
window.cloudSave=function(){
  if(!uid)return;
  const b=writeBatch(db);let n=0;
  COLL.forEach(c=>{const cur=snapOf(c),old=LAST[c]||{};
    for(const id in cur){if(cur[id]!==old[id]){b.set(doc(db,"users",uid,c,id),JSON.parse(cur[id]));n++}}
    for(const id in old){if(!(id in cur)){b.delete(doc(db,"users",uid,c,id));n++}}
    LAST[c]=cur});
  if(n)b.commit().catch(e=>{LAST={};alert("Errore di salvataggio: "+e.message)});
};
function listen(){
  COLL.forEach(c=>{
    unsubs.push(onSnapshot(collection(db,"users",uid,c),snap=>{
      if(started&&snap.metadata.hasPendingWrites)return;
      const arr=S[c],seen=new Set();
      snap.forEach(d=>{const data={...d.data(),id:d.id};seen.add(d.id);
        const ex=arr.find(o=>o.id===d.id);
        if(ex){for(const k in ex)delete ex[k];Object.assign(ex,data)}else arr.push(data)});
      for(let i=arr.length-1;i>=0;i--)if(!seen.has(arr[i].id))arr.splice(i,1);
      LAST[c]=snapOf(c);
      if(!started){if(++loaded===COLL.length){started=true;q("#boot").hidden=true;window.appStart()}}
      else if(view!=="propform"&&!q("#dlg").open)render();
    },err=>alert("Errore di lettura dati: "+err.message)));
  });
}
onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];loaded=0;started=false;LAST={};
  COLL.forEach(c=>{S[c].length=0});
  if(u){uid=u.uid;q("#login").hidden=true;q("#logout").hidden=false;q("#boot").hidden=false;q("#boot").textContent="Caricamento dati…";listen()}
  else{uid=null;q("#login").hidden=false;q("#logout").hidden=true;q("#boot").hidden=true}
});
q("#lf").onsubmit=async e=>{e.preventDefault();q("#lerr").textContent="";
  try{await signInWithEmailAndPassword(auth,q("#lem").value,q("#lpw").value)}
  catch(err){q("#lerr").textContent="Accesso non riuscito: controlla email e password."}};
q("#logout").onclick=()=>signOut(auth);
</script>
